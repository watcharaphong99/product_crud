services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: product-crud-backend
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost
      PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - app-network
    restart: unless-stopped
    labels:
      logging: "promtail"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: product-crud-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
    labels:
      logging: "promtail"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: product-crud-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9099:9090"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - backend

  loki:
    image: grafana/loki:3.3.2
    container_name: product-crud-loki
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - app-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    container_name: product-crud-promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: product-crud-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

networks:
  app-network:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
